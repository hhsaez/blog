baseURL: https://blog.hhsaez.com/
locale: en-us
title: H. Hernan Saez
theme: hugo-PaperMod
params:
  defaultTheme: auto

  ShowShareButtons: false
  ShowReadingTime: true
  ShowBreadCrumbs: true
